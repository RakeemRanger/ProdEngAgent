trigger: none
pr: none

resources:
  pipelines:
    - pipeline: build
      source: '\ProdEngAgent\build\Rai.UnOfficial.Build'
      trigger: none

stages:
  - stage: Deploy
    jobs:
      - deployment: DeployInfra
        environment: development
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - download: none

                - download: build
                  artifact: infrastructure
                
                - task: AzureCLI@2
                  displayName: PreFlight Validation
                  inputs:
                    azureSubscription: 'rai-ccf-arm-dev'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                        set -euo pipefail
                        az deployment sub what-if \
                        --location eastus \
                        --template-file "$(Pipeline.Workspace)/build/infrastructure/main.json"

                - task: AzureCLI@2
                  displayName: Deploy ARM template
                  inputs:
                    azureSubscription: 'rai-ccf-arm-dev'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      az deployment sub create \
                        --location eastus \
                        --template-file "$(Pipeline.Workspace)/build/infrastructure/main.json"